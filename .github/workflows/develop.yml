name: native-preview-bake
on:
  push:
    branches:
      - v3-rewrite
    paths:
      - '.github/workflows/develop.yml'
      - 'dockerfile/**'
      - 'ci/**'
      - 'docker-bake.hcl'
      - 'stash/**'
      - 'VERSION'
  workflow_dispatch:
    inputs:
      preserve_compatible_release:
        description: Preserve the frozen final v2.5-compatible images without rebuilding
        type: boolean
        default: false
      stash_digest:
        description: Stash source image digest (sha256:...), required for a native preview build
        type: string
        default: ''

concurrency:
  group: ${{ github.ref }}-native-${{ inputs.preserve_compatible_release && 'preserve-compat' || 'bake' }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  validate:
    if: ${{ !inputs.preserve_compatible_release }}
    runs-on: ubuntu-24.04
    outputs:
      source: ${{ steps.source.outputs.source }}
      revision: ${{ steps.source.outputs.revision }}
    steps:
      - uses: actions/checkout@v6
      - id: source
        name: Validate explicit Stash source
        env:
          STASH_DIGEST: ${{ inputs.stash_digest }}
        run: |
          python3 - <<'PY'
          import os, re
          value = os.environ['STASH_DIGEST']
          if os.environ['GITHUB_EVENT_NAME'] == 'workflow_dispatch':
              if not re.fullmatch(r'sha256:[0-9a-f]{64}', value):
                  raise SystemExit('A full Stash image digest is required; floating tags are not accepted.')
          else:
              value = 'sha256:0faad6d2cffb19dc97421b0879e638c83e4fe245eda871505c5d913d3fc44805'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('source=ghcr.io/notsafeforgit/stash@' + value + '\n')
              output.write('revision=' + os.environ['GITHUB_SHA'][:12] + '-' + value[7:19] + '\n')
          PY
      - uses: docker/setup-buildx-action@v4
      - name: Check baked source and publication targets
        env:
          STASH_SOURCE: ${{ steps.source.outputs.source }}
          NATIVE_REVISION: ${{ steps.source.outputs.revision }}
        run: |
          docker buildx bake --print native_ci_alpine native_ci_debian > native-bake.json
          python3 ci/check-native-bake.py native-bake.json "$STASH_SOURCE"

  bake:
    needs: validate
    if: ${{ github.event_name == 'workflow_dispatch' && !inputs.preserve_compatible_release }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - id: meta
        name: Set build metadata
        run: |
          echo "EPOCH=$(git log -1 --pretty=%ct)" >> "$GITHUB_ENV"
          echo "TIMESTAMP=$(git log -1 --pretty=%cI)" >> "$GITHUB_OUTPUT"
          echo "GITHASH=${GITHUB_SHA:0:12}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
        with:
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/bake-action@v7
        with:
          push: true
          targets: |
            native_ci_alpine
            native_ci_debian
        env:
          GITHASH: ${{ steps.meta.outputs.GITHASH }}
          BUILD_DATE: ${{ steps.meta.outputs.TIMESTAMP }}
          STASH_SOURCE: ${{ needs.validate.outputs.source }}
          NATIVE_REVISION: ${{ needs.validate.outputs.revision }}
          SOURCE_DATE_EPOCH: ${{ env.EPOCH }}

  preserve-compatible-release:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.preserve_compatible_release }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          repository: notsafeforgit/stash
          ref: b76c600a8be0a504fbbb2b928e1fb3891f30ed6c
          path: release-tools
      - name: Install registry copy tool
        run: sudo apt-get update && sudo apt-get install -y skopeo
      - name: Check preservation invariants
        run: python3 -m unittest discover -s release-tools/scripts -p test_preserve_compatible_images.py
      - name: Authenticate registry tools
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | skopeo login --authfile "$RUNNER_TEMP/registry-auth.json" --username "$GITHUB_ACTOR" --password-stdin ghcr.io
          printf '%s' "$GHCR_TOKEN" | docker login --username "$GITHUB_ACTOR" --password-stdin ghcr.io
      - name: Preserve compatible image manifests
        env:
          REGISTRY_AUTH_FILE: ${{ runner.temp }}/registry-auth.json
        run: |
          python3 release-tools/scripts/preserve_compatible_images.py \
            --manifest release-tools/docs/releases/v2.5-compatible-final.json \
            --repository ghcr.io/notsafeforgit/stash-s6 \
            --receipt compatible-release-receipt.json
      - uses: actions/upload-artifact@v4
        with:
          name: compatible-stash-s6-release-receipt
          path: compatible-release-receipt.json
          if-no-files-found: error
